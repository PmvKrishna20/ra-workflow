# -----------------------------------------------------------------------

[supabase]
db_url = "postgresql://postgres.XXXX:YOUR_PASSWORD@aws-0-us-east-1.pooler.supabase.com:6543/postgres"

# Creates your own Manager login the FIRST time the app runs after this
# update. After that first run, you can create every other account (TLs,
# RAs, or additional Managers) from inside the app's "Manage users" page —
# this secret is only used once, to bootstrap the very first account.
[bootstrap_admin]
username = "vamsi"
password = "choose-a-strong-password-here"
display_name = "Vamsi"
